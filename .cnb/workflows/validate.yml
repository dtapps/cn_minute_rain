# 中国分钟级降水预报 · 发布前校验流水线（cnb.cool）
# 触发：任意分支 push。
# 两个关卡：
#   1) pytest  —— 用 mock 接口真实加载集成，覆盖 数值解析 / 多地点配置流 / coordinator 请求 / sensor 实体创建。
#                不依赖真实网络与真实 HA 实例，是"发布前保证没问题"的主关卡。
#   2) hassfest —— 校验 manifest.json、目录结构、翻译文件与配置流是否一致（HACS 收录硬性门槛）。
#                通过官方 Docker 镜像运行；仅当镜像拉取失败（网络问题）时宽容跳过并打印警告，
#                其余情况 hassfest 检出任何错误都会使本步失败、中断流水线。

"**":
  push:
    - runner:
        tags: cnb:arch:amd64
      docker:
        image: python:3.14
      services:
        - docker
      stages:
        - name: 安装测试依赖
          script: |
            pip config set global.index-url https://mirrors.cloud.tencent.com/pypi/simple
            python -m pip install --upgrade pip
            pip install -r requirements_test.txt

        - name: 运行 pytest（解析 / 配置流 / 传感器逻辑）
          script: pytest -qq

        - name: hassfest 结构合规校验（manifest / 翻译 / 配置流一致性）
          image: docker:cli
          script: |
            if ! docker pull ghcr.io/home-assistant/hassfest:latest 2>/dev/null; then
              echo "::warning::无法拉取 hassfest 镜像（网络问题），跳过；请在本地用 docker run --rm -v \"\$PWD\":/github/workspace ghcr.io/home-assistant/hassfest:latest 补跑"
              exit 0
            fi
            docker run --rm -v "$PWD":/github/workspace ghcr.io/home-assistant/hassfest:latest
