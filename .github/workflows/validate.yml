name: Validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  hassfest:
    name: Hassfest 结构合规校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: Hassfest 校验（manifest / 翻译 / 配置流一致性）
        uses: home-assistant/actions/hassfest@master

  pytest:
    name: Pytest 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: 运行 pytest
        run: pytest -qq
